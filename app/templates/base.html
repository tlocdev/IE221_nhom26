<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Scam Detector{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css?v=4" />
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="/">
        <span class="brand-mark">SD</span>
        <span class="brand-text">Scam Detector</span>
      </a>
      <nav>
        <a href="/">Phân tích</a>
        <a href="/history">Lịch sử</a>
        <a href="/docs">API</a>
      </nav>
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <p>Kết quả là <em>mức độ rủi ro / dấu hiệu</em> — không phải phán quyết pháp lý rằng website chắc chắn lừa đảo.</p>
    </footer>
  </div>

  <script src="/static/js/app.js?v=3" defer></script>
</body>
</html>
